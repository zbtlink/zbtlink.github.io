<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ home_path | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/images/zbt-logo.png' | relative_url }}" alt="zbt">
    </a>
    <nav class="nav-links">
      <a href="{{ home_path | relative_url }}" {% if page.url == home_path %}class="is-active"{% endif %}>{{ t.home }}</a>
      <a href="{{ firmware_path | relative_url }}" {% if page.url contains '/firmware' or page.url contains '/devices' %}class="is-active"{% endif %}>{{ t.firmware }}</a>
      <a href="{{ blog_path | relative_url }}" {% if page.url contains '/blog' or page.layout == 'post' %}class="is-active"{% endif %}>{{ t.blog }}</a>
      <a href="{{ about_path | relative_url }}" {% if page.url contains '/about' %}class="is-active"{% endif %}>{{ t.about }}</a>
      <span class="lang-switch">
        {% if lang == 'zh' %}
          <a href="{{ switch_url | relative_url }}">EN</a>
          <span class="is-active">中文</span>
        {% else %}
          <span class="is-active">EN</span>
          <a href="{{ switch_url | relative_url }}">中文</a>
        {% endif %}
      </span>
    </nav>
  </div>
</header>
