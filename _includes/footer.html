<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <img class="footer-logo" src="{{ '/assets/images/zbt-logo.png' | relative_url }}" alt="zbt">
      <p>{{ t.footer_blurb }}</p>
    </div>
    <div>
      <h4>{{ t.footer_nav }}</h4>
      <a href="{{ firmware_path | relative_url }}">{{ t.footer_models }}</a>
      <a href="{{ blog_path | relative_url }}">{{ t.footer_posts }}</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
    <div>
      <h4>{{ t.footer_source }}</h4>
      <a href="https://github.com/zbtlink/zbtlink.github.io">GitHub</a>
      <a href="https://open.zbtlink.com">open.zbtlink.com</a>
    </div>
  </div>
  <div class="container footer-meta">© {{ 'now' | date: '%Y' }} ZBT Link</div>
</footer>
